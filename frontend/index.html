<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>PathLab</title>
</head>
<body>
    <h1>PathLab</h1>
    <p>Interactive pathfinding visualizer</p>
    
    <div class="toolbar">
        <label for="gridSize">Grid Size</label>
        <select id="gridSize">
            <option value="5">5 x 5</option>
            <option value="10">10 x 10</option>
            <option value="20">20 x 20</option>
        </select>

        <label for="algorithm">Algorithm</label>
        <select id="algorithm">
            <option value="bfs">BFS</option>
            <option value="dijkstra">Dijkstra</option>
            <option value="astar">Astar</option>
        </select>

        <button id="runBFS">Run Algorithm</button>
        <button id="resetGrid">Reset Grid</button>

        <label for="animationSpeed">Speed</label>
        <select id="animationSpeed">
            <option value="200">Slow</option>
            <option value="80" selected>Normal</option>
            <option value="10">Fast</option>
        </select>
    </div>

    <div id="grid"></div>

    <p id = "resultStatus"></p>

    <section id="statistics">
        <h3>Algortihm Statistics</h3>

        <p>Path moves: <span id="pathMoves">-</span></p>
        <p>Explored cells: <span id="exploredCount">-</span></p>
        <p>Total grid cells:<span id="totalCells">-</span></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
